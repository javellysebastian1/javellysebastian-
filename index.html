<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUXO</title>
<meta name="description" content="Tu ruta diaria para una mente culta.">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AUXO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
/* AUXO · edición editorial. Una columna (máx. 560px), oscuro por defecto, dorado como acento, un color por pilar. */
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --raised:#EDE8DF; --fg:#14161B; --muted:#5D6169; --line:#DDD6CA;
  --gold:#8A6A2B; --gold-fg:#FFFFFF; --gold-soft:#F1E7D2;
  --ok-bg:#E5F1EA; --ok:#1F6B4A; --ok-fg:#124430; --bad-bg:#F7E8E3; --bad:#A34A2E; --bad-fg:#6E2C17;
  --ink:#0E1116; --ink-2:#1A1F27; --ink-line:#2E3540; --ink-fg:#F2EEE6; --ink-soft:#CFC9BE; --ink-muted:#949AA4; --ink-gold:#D4B26A;
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --read:'Newsreader','Iowan Old Style',Georgia,serif;
  --ui:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mente:#7A5AF0; --caracter:#B07A1E; --cuerpo:#D0573C; --cultura:#B23A5C; --mundo:#2A8A9C; --patrimonio:#3A8C5A; --futuro:#3B7BE8; --gusto:#9A6A3C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --raised:#1F242D; --fg:#ECE8DF; --muted:#9AA0AA; --line:#2A303A;
  --gold:#C9A45C; --gold-fg:#15110A; --gold-soft:#2A2418;
  --ok-bg:#15291E; --ok:#5FBF8C; --ok-fg:#BFE8D0; --bad-bg:#33201A; --bad:#E08A6B; --bad-fg:#F5CDBD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --raised:#1F242D; --fg:#ECE8DF; --muted:#9AA0AA; --line:#2A303A;
  --gold:#C9A45C; --gold-fg:#15110A; --gold-soft:#2A2418;
  --ok-bg:#15291E; --ok:#5FBF8C; --ok-fg:#BFE8D0; --bad-bg:#33201A; --bad:#E08A6B; --bad-fg:#F5CDBD; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
p{margin:0;overflow-wrap:anywhere}
button,a,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.display{font-family:var(--display);font-weight:400}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{min-height:52px;border:0;border-radius:4px;padding:0 22px;font-weight:600;font-size:15px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn-primary{background:var(--gold);color:var(--gold-fg)}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn-gold{background:var(--ink-gold);color:#15110A}
.btn-line{background:transparent;border:1px solid rgba(242,238,230,.35);color:var(--ink-fg)}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
svg{flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--fg);padding-bottom:8px}
.sec-h h2{font-family:var(--display);font-size:26px;line-height:1.1}
.sec-h span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.pd{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--c,var(--gold));flex:none}

/* Cabecera de revista */
.mast{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.mast-meta{width:100%;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px}
.logo{font-family:var(--display);font-size:46px;line-height:1;letter-spacing:.34em;margin-right:-.34em;font-weight:500}
.mast-sub{font-family:var(--read);font-style:italic;font-size:16px;color:var(--muted);text-align:center}
.mast-sub b{font-style:normal;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-right:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.top .logo-s{font-family:var(--display);font-size:22px;letter-spacing:.3em;font-weight:500}
.top span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.page-t{display:flex;flex-direction:column;gap:8px}
.page-t h1{font-family:var(--display);font-size:40px;line-height:1.02}
.page-t p{font-family:var(--read);font-size:18px;line-height:1.5;color:var(--muted)}

/* Portada */
.cover{position:relative;border-radius:6px;overflow:hidden;min-height:470px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;color:var(--ink-fg);background:radial-gradient(120% 80% at 85% 0%,color-mix(in srgb,var(--c1,#C9A45C) 55%,transparent),transparent 60%),radial-gradient(90% 70% at 0% 30%,color-mix(in srgb,var(--c2,#3B7BE8) 45%,transparent),transparent 65%),#0E1116}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;color:transparent}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,22,.15) 0%,rgba(14,17,22,.35) 35%,rgba(14,17,22,.92) 70%,#0E1116 100%)}
.cover-in{position:relative;z-index:1;padding:22px;display:flex;flex-direction:column;gap:14px}
.cover .eyebrow{color:var(--ink-gold)}
.cover h1{font-family:var(--display);font-size:42px;line-height:1.02;letter-spacing:-.01em}
.cover p{font-family:var(--read);font-size:18px;line-height:1.45;color:var(--ink-soft)}
.cover-tag{position:relative;z-index:1;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-fg)}
.cover-tag i{font-style:normal;padding:5px 9px;border:1px solid rgba(242,238,230,.4);border-radius:2px;background:rgba(14,17,22,.35)}
.ticks{display:flex;gap:4px}
.ticks span{width:14px;height:3px;background:rgba(242,238,230,.3)}
.ticks span.on{background:var(--ink-gold)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:2px;background:rgba(242,238,230,.1);font-size:12px;font-weight:600;color:var(--ink-fg)}
.cover-cta{display:flex;flex-direction:column;gap:8px;margin-top:4px}

/* Índice de la ruta */
.route{display:flex;flex-direction:column}
.route-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 4px 14px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;position:relative}
.route-item .num{font-family:var(--display);font-size:24px;color:var(--gold);text-align:center;line-height:1}
.route-item.done .num{color:var(--muted)}
.route-item.next:before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;background:var(--gold)}
.route-item .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.t1{font-weight:600}
.t2{font-size:13px;color:var(--muted);line-height:1.35}
.route-item.done .t1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.mins{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.mins svg{color:var(--ok)}

/* Ayer · Hoy · Mañana */
.ahm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ahm button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.ahm .y{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold)}
.ahm .k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ahm .tt{font-size:13px;font-weight:600;line-height:1.3}

/* Selector segmentado */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{min-height:54px;border:0;border-left:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.seg button:first-child{border-left:0}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--bg)}
.seg button[aria-checked="true"] span{color:var(--bg);opacity:.75}
.seg b{font-size:14px;font-weight:600}
.seg span{font-size:12px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-size:32px;font-weight:400;line-height:1;font-variant-numeric:lining-nums}
.stats span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.week i{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.week i.on{background:var(--gold);border-color:var(--gold);color:var(--gold-fg)}
.week i.today{border:2px solid var(--fg)}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--gold)}

/* Pilares */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:16px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;overflow:hidden}
.pcard:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.pcard .r{font-family:var(--display);font-size:30px;line-height:1;color:var(--c)}
.pcard b{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.1}
.pcard span{font-size:12px;color:var(--muted);line-height:1.35}
.pcard .bar2{margin-top:auto;height:3px;background:var(--raised);border-radius:2px;overflow:hidden}
.pcard .bar2 i{display:block;height:100%;background:var(--c)}
.plan{display:flex;flex-direction:column}
.plan-d{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.plan-d .d{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.plan-d.today .d{color:var(--gold)}
.plan-d .n{font-family:var(--display);font-size:19px;line-height:1.2}
.plan-d .ps{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:4px}
.plan-d .ps span{display:inline-flex;align-items:center;gap:6px}
.phero{position:relative;border-radius:6px;border:1px solid var(--ink-line);padding:24px 20px;color:var(--ink-fg);background:radial-gradient(100% 90% at 100% 0%,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%),#0E1116;display:flex;flex-direction:column;gap:10px}
.phero .r{font-family:var(--display);font-size:64px;line-height:.9;color:var(--ink-gold)}
.phero h1{font-family:var(--display);font-size:40px;line-height:1}
.phero p{font-family:var(--read);font-size:18px;color:var(--ink-soft)}
.mat{border-top:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:12px}
.mat h3{font-family:var(--display);font-size:24px;line-height:1.1}
.mat .dsc{font-family:var(--read);font-size:17px;line-height:1.5;color:var(--muted)}
.ess{display:flex;flex-wrap:wrap;gap:6px}
.ess span{padding:4px 9px;border:1px solid var(--line);border-radius:2px;font-size:12px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tri b{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tri ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.35}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 0;font-size:13px;font-weight:600;color:var(--muted);min-height:44px}
.arch{display:flex;flex-direction:column}
.arch button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;text-align:left;width:100%}
.arch .no{font-family:var(--display);font-size:22px;color:var(--gold)}
.season-ep{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.season-ep:first-of-type{border-top:0}
.season-ep .dot{width:30px;height:30px;border-radius:15px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.season-ep .dot.on{background:var(--gold);border-color:var(--gold);color:var(--gold-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:2px;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:700}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.notice{padding:14px 16px;border-radius:6px;border:1px solid var(--gold);color:var(--fg);font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.radar{width:100%;max-width:380px;margin:0 auto;display:block}
.radar text{font-family:var(--ui);font-size:11px;font-weight:600;fill:var(--muted)}

/* Recorrido */
.flow{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flow.deep{background:var(--ink);color:var(--ink-fg)}
.flow-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:10px 28px}
.bar{display:grid;gap:3px}
.bar span{height:2px;background:var(--line)}
.bar span.on{background:var(--gold)}
.deep .bar span{background:var(--ink-line)}
.deep .bar span.on{background:var(--ink-gold)}
.flow-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flow-top .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;flex:1}
.deep .flow-top .lbl{color:var(--ink-muted)}
.flow h2{font-family:var(--display);font-size:36px;line-height:1.04}
.flow-foot{margin-top:auto;display:flex;gap:10px;padding-top:12px}
.flow-foot .btn{flex:1}
.deep .eyebrow{color:var(--ink-gold)}

/* Tarjetas de repaso */
.flash{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:240px}
.flash .q{font-family:var(--read);font-size:22px;line-height:1.35}
.flash .a{padding:14px 16px;border-left:3px solid var(--gold);background:var(--raised);font-size:16px}

/* Noticias */
.news{border-top:1px solid var(--line)}
.news:last-of-type{border-bottom:1px solid var(--line)}
.news-head{width:100%;border:0;background:transparent;text-align:left;padding:16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.news-head .h{display:flex;flex-direction:column;gap:8px;min-width:0}
.news-head b{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.15}
.news-body{padding:0 0 20px;display:flex;flex-direction:column;gap:14px}
.blk{display:flex;flex-direction:column;gap:4px}
.blk p{font-family:var(--read);font-size:17px;line-height:1.55}
.amq{background:var(--ink);color:var(--ink-fg);border-radius:6px;padding:16px}
.amq .eyebrow{color:var(--ink-gold)}
.prev{padding:12px 14px;border-left:3px solid var(--line);font-size:14px;color:var(--muted)}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--gold)}

/* Historia */
.story-tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-gold)}
.story-body{display:flex;flex-direction:column;gap:16px;font-family:var(--read);font-size:19px;line-height:1.6;color:var(--ink-soft)}
.story-body h3{font-family:var(--display);font-size:32px;line-height:1.08;color:var(--ink-fg)}
.opt{min-height:56px;padding:14px 18px;border:1px solid var(--ink-line);border-radius:6px;background:var(--ink-2);color:var(--ink-fg);text-align:left;font-family:var(--ui);font-size:16px;font-weight:500;width:100%}
.opt[aria-pressed="true"]{background:var(--ink-gold);color:#15110A;border-color:var(--ink-gold)}
.recall{padding:12px 14px;border-left:3px solid var(--ink-gold);background:var(--ink-2);font-size:15px;font-family:var(--ui)}
.quote{font-family:var(--display);font-style:italic;font-size:32px;line-height:1.15;color:var(--ink-fg)}
.deep a{color:var(--ink-gold)}
.deep textarea{background:var(--ink-2);border-color:var(--ink-line);color:var(--ink-fg)}
.ask{border-top:1px solid var(--ink-line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ask-out{white-space:pre-wrap;font-family:var(--read);font-size:17px;line-height:1.55;color:var(--ink-soft)}
label{font-size:14px;font-weight:600}
textarea,input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:16px;line-height:1.4;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}

/* Preguntas */
.qz{display:flex;flex-direction:column;gap:10px}
.qz .qopt{min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;width:100%;font-size:15px;line-height:1.35;display:flex;align-items:center;justify-content:space-between;gap:10px}
.qz .qopt.right{background:var(--ok-bg);border:2px solid var(--ok);color:var(--ok-fg);font-weight:600}
.qz .qopt.wrong{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad-fg)}
.feedback{padding:14px 16px;border-left:3px solid var(--gold);background:var(--raised);font-size:15px;display:flex;flex-direction:column;gap:10px}
.feedback p{font-family:var(--read);font-size:17px;line-height:1.5}
.idea{padding:14px 16px;background:var(--ink);color:var(--ink-fg);border-radius:6px;font-family:var(--read);font-size:17px;line-height:1.45}
.idea .eyebrow{display:block;margin-bottom:4px;color:var(--ink-gold)}
.mcard{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.mcard h3{font-family:var(--display);font-size:28px;line-height:1.08}
.mcard .txt p{font-family:var(--read);font-size:18px;line-height:1.6}
.mtag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mtag .m{color:var(--fg)}
.mtag .t{padding:3px 7px;border:1px solid var(--line);border-radius:2px;letter-spacing:.1em}

/* Francés y palabra */
.fr,.word{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px}
.fr .phrase{font-family:var(--display);font-size:30px;line-height:1.15}
.word .w{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:-.01em}
.word .def{font-family:var(--read);font-size:19px;line-height:1.45}
.word .ex{font-family:var(--read);font-style:italic;font-size:17px;color:var(--muted);border-left:3px solid var(--gold);padding-left:12px}

/* Datos: ayer, hoy, mañana */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;min-height:48px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.dato{display:flex;flex-direction:column;gap:14px}
.dato .y{font-family:var(--display);font-size:72px;line-height:.9;color:var(--gold);font-variant-numeric:lining-nums}
.dato h3{font-family:var(--display);font-size:30px;line-height:1.08}
.dato .lead{font-family:var(--read);font-size:21px;line-height:1.4}
.dato .txt,.mcard .txt{display:flex;flex-direction:column;gap:12px}
.dato .txt p{font-family:var(--read);font-size:18px;line-height:1.6;color:var(--muted)}


/* Facts */
.flist{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;text-align:left;width:100%;min-height:56px}
.fitem .ep{font-family:var(--display);font-size:17px;line-height:1.1;color:var(--c,var(--gold))}
.fitem .m{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fitem .tt{display:block;font-weight:600;line-height:1.3}
.dato .y.sm{font-size:38px;line-height:1}
.fact{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--gold));border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fact .fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fact .ep{font-family:var(--display);font-size:22px;line-height:1;color:var(--c,var(--gold))}
.fact h4{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15}
.fact .lead{font-family:var(--read);font-size:18px;line-height:1.45}
.fact .txt{display:flex;flex-direction:column;gap:10px}
.fact .txt p{font-family:var(--read);font-size:16.5px;line-height:1.6;color:var(--muted)}
.fact details{border-top:1px solid var(--line);padding-top:10px}
.fact summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:32px;display:flex;align-items:center}
.fact .old{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.fact .old:last-child{border-bottom:0}
.fact .old b{font-weight:600}
.fact .old p{font-family:var(--read);font-size:15.5px;line-height:1.5;color:var(--muted)}
.fdots{display:flex;gap:4px;flex-wrap:wrap}
.fdots span{flex:1;min-width:10px;height:3px;background:var(--line)}
.fdots span.on{background:var(--gold)}

/* Reproductor */
.player{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player-in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.35)}

.lect details{border:1px solid var(--line);border-radius:6px;padding:14px 18px;background:var(--surface)}
.lect summary{cursor:pointer;font-weight:600;min-height:28px}

.lect h3{font-family:var(--display);font-size:28px;line-height:1.1}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function enriquecer(h){
  return h.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,function(m,a,b){return '<button type="button" class="term" data-term="'+a+'" data-def="'+b+'">'+a+'</button>';})
          .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
          .replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
}
function paras(s){return String(s||'').split(/\n\s*\n/).map(function(p){return '<p>'+enriquecer(esc(p)).replace(/\n/g,'<br>')+'</p>';}).join('');}
function linea(s){return enriquecer(esc(s));}
function plano(s){return String(s||'').replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g,'$1').replace(/\*/g,'');}
function figura(img){
  if(!img||!img.url)return '';
  return '<figure class="fig"><img src="'+esc(img.url)+'" alt="'+esc(img.alt||'')+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.hidden=true">'+
    ((img.pie||img.credito)?'<figcaption>'+esc(img.pie||'')+(img.credito?(img.pie?' · ':'')+esc(img.credito):'')+'</figcaption>':'')+'</figure>';
}

function hoy(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function sumarDias(f,n){var d=new Date(f+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function lunes(f){var d=new Date(f+'T12:00:00Z');var w=(d.getUTCDay()+6)%7;return sumarDias(f,-w);}
function fechaLarga(f){try{return new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(f+'T12:00:00Z'));}catch(e){return f;}}
function fechaMast(f){try{return new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(f+'T12:00:00Z'));}catch(e){return f;}}

/* ---------- Datos ---------- */
function progRef(){return S.db.doc('progress/'+S.edition.fecha);}
var saveT=null;
function guardarProg(){
  if(!S.db||!S.edition)return;
  S.prog.fecha=S.edition.fecha;S.prog.edicion=S.edition.id;S.prog.actualizado=new Date().toISOString();
  clearTimeout(saveT);
  saveT=setTimeout(function(){progRef().set(JSON.parse(JSON.stringify(S.prog))).catch(function(){});},400);
}
function marcarPaso(p){
  S.prog.pasos=S.prog.pasos||{};
  if(S.prog.pasos[p])return;
  S.prog.pasos[p]=true;
  var req=pasosActivos(S.prog.modo||S.modo);
  S.prog.completada=req.every(function(x){return S.prog.pasos[x];});
  guardarProg();
}
function cargar(){
  var f=hoy();S.deArchivo=false;
  return S.db.doc('editions/'+f).get().then(function(s){
    if(s.exists)return s.data();
    return S.db.collection('editions').orderBy('fecha','desc').limit(1).get().then(function(q){return q.empty?null:q.docs[0].data();});
  }).then(function(ed){
    S.edition=ed;
    var tasks=[S.db.doc('meta/temporadas').get().then(function(s){S.temporadas=s.exists?s.data():null;}),
      S.db.doc('meta/hechos').get().then(function(s){S.hechos=s.exists?s.data():null;}).catch(function(){S.hechos=null;})];
    if(ed)tasks.push(cargarProg(ed.fecha));
    tasks.push(cargarSemana());
    tasks.push(cargarRepaso());
    return Promise.all(tasks);
  }).then(function(){S.estado='listo';render();})
  .catch(function(e){S.estado='error';S.error=(e&&e.code)||'unavailable';render();});
}
function cargarProg(f){
  return S.db.doc('progress/'+f).get().then(function(s){S.prog=s.exists?JSON.parse(JSON.stringify(s.data())):{};if(S.prog.modo&&MODOS[S.prog.modo])S.modo=S.prog.modo;});
}
function abrirEdicion(f){
  S.db.doc('editions/'+f).get().then(function(s){
    if(!s.exists)return;
    S.edition=s.data();S.deArchivo=f!==hoy();
    return cargarProg(f).then(function(){S.view='home';render();window.scrollTo(0,0);});
  }).catch(function(){});
}
function cargarSemana(){
  var l=lunes(hoy());
  return S.db.collection('progress').where('fecha','>=',l).get().then(function(q){S.semana=q.docs.map(function(d){return d.data();});}).catch(function(){S.semana=[];});
}
function cargarRepaso(){
  return S.db.collection('review').where('proxima','<=',hoy()).orderBy('proxima','asc').limit(30).get().then(function(q){
    S.pendientes=q.docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;return x;}).filter(function(x){return !x.archivada;});
  }).catch(function(){S.pendientes=[];});
}
/* Historial completo: para el archivo, el mapa de pilares y las rachas. */
function cargarHistorial(){
  if(S.archivo&&S.progTodo)return Promise.resolve();
  return Promise.all([
    S.db.collection('editions').orderBy('fecha','desc').limit(60).get().then(function(q){
      S.archivo=q.docs.map(function(d){var e=d.data()||{};return {fecha:e.fecha,numero:e.numero,titulo:e.titulo,temporada:e.temporada,materias:(e.materias||[]).map(function(m){return {materia:m.materia,pilar:m.pilar,tiempo:m.tiempo};})};}).filter(function(e){return e.fecha;});
    }).catch(function(){S.archivo=[];}),
    S.db.collection('progress').get().then(function(q){S.progTodo={};q.docs.forEach(function(d){var p=d.data();if(p&&p.fecha)S.progTodo[p.fecha]=p;});}).catch(function(){S.progTodo={};})
  ]).then(function(){if(S.view!=='home')render();});
}
function cuentaPilares(){
  var c={};PILARES.forEach(function(p){c[p.id]=0;});
  (S.archivo||[]).forEach(function(e){
    var p=(S.progTodo||{})[e.fecha];if(!p||!p.pasos||!p.pasos.materias)return;
    e.materias.forEach(function(m){var pl=pilarDe(m);if(pl)c[pl.id]++;});
  });
  return c;
}
function racha(){
  var P=S.progTodo||{};var f=hoy();var n=0;
  if(!(P[f]&&P[f].completada))f=sumarDias(f,-1);
  while(P[f]&&P[f].completada){n++;f=sumarDias(f,-1);}
  return n;
}
function tarjetasCalentamiento(){
  var c=S.pendientes.slice(0,3);
  if(c.length<3&&S.edition&&S.edition.calentamiento){
    S.edition.calentamiento.forEach(function(x,i){
      if(c.length>=3)return;
      var id='cal-'+S.edition.fecha+'-'+i;
      if(c.some(function(y){return y.id===id;}))return;
      c.push({id:id,pregunta:x.pregunta,respuesta:x.respuesta,origen:x.origen||'',intervalo:-1,nueva:true});
    });
  }
  return c;
}
function responderTarjeta(card,sabia){
  if(!S.db)return;
  var f=hoy();var iv=typeof card.intervalo==='number'?card.intervalo:-1;
  var doc={pregunta:card.pregunta,respuesta:card.respuesta,origen:card.origen||'',ultima:f};
  if(sabia){iv=iv+1;if(iv>=INTERVALOS.length){doc.archivada=true;doc.intervalo=iv;doc.proxima='9999-12-31';}else{doc.intervalo=iv;doc.proxima=sumarDias(f,INTERVALOS[iv]);doc.archivada=false;}}
  else{doc.intervalo=0;doc.proxima=sumarDias(f,1);doc.archivada=false;}
  S.prog.repaso=S.prog.repaso||{bien:0,total:0};
  S.prog.repaso.total++;if(sabia)S.prog.repaso.bien++;
  guardarProg();
  S.pendientes=S.pendientes.filter(function(x){return x.id!==card.id;});
  return S.db.doc('review/'+card.id).set(doc).catch(function(){});
}
function sembrar(items){
  var f=hoy(),ed=S.edition;
  items.forEach(function(it){
    if(!it.r||!it.r.pregunta)return;
    var ref=S.db.doc('review/'+it.id);
    ref.get().then(function(s){if(!s.exists)return ref.set({pregunta:it.r.pregunta,respuesta:it.r.respuesta,origen:ed.fecha,intervalo:-1,proxima:sumarDias(f,1),archivada:false});}).catch(function(){});
  });
}
function sembrarRepaso(){
  if(!S.db||!S.edition||S.prog.repasoSembrado)return;
  var ed=S.edition,items=[];
  (ed.historia&&ed.historia.repaso||[]).forEach(function(r,i){items.push({id:'h-'+ed.fecha+'-'+i,r:r});});
  if(ed.frances&&ed.frances.repaso)items.push({id:'f-'+ed.fecha,r:ed.frances.repaso});
  if(ed.palabra&&ed.palabra.repaso)items.push({id:'p-'+ed.fecha,r:ed.palabra.repaso});
  sembrar(items);
  S.prog.repasoSembrado=true;guardarProg();
}
function sembrarExtras(p){
  if(!S.db||!S.edition)return;
  var ed=S.edition,items=[];
  if(p==='materias'&&!S.prog.materiasSembradas){
    (ed.materias||[]).forEach(function(m,i){if(m.repaso)items.push({id:'m-'+ed.fecha+'-'+i,r:m.repaso});});
    S.prog.materiasSembradas=true;
  }
  if(p==='lectura'&&ed.lectura&&!S.prog.lecturaSembrada){
    (ed.lectura.repaso||[]).forEach(function(r,i){items.push({id:'l-'+ed.fecha+'-'+i,r:r});});
    S.prog.lecturaSembrada=true;
  }
  if(p==='datos'&&listaHechos(ed).length&&!S.prog.datosSembrados){
    listaHechos(ed).forEach(function(d,i){if(d&&d.repaso)items.push({id:'d-'+ed.fecha+'-'+i,r:d.repaso});});
    S.prog.datosSembrados=true;
  }
  sembrar(items);
  guardarProg();
}


/* Facts: lista unificada (ediciones nuevas: hechos[]; antiguas: datos{pasado,presente,futuro}). */
function listaHechos(ed){
  if(!ed)return [];
  if(ed.hechos&&ed.hechos.length)return ed.hechos.filter(function(h){return h&&h.dato;});
  if(ed.datos){return ['pasado','presente','futuro'].map(function(k){var d=ed.datos[k];if(!d)return null;return {materia:TIEMPO[k],pilar:d.pilar,epoca:d.cuando,titulo:d.titulo,dato:d.dato,explicacion:d.explicacion,imagen:d.imagen,fuente:d.fuente,repaso:d.repaso};}).filter(Boolean);}
  return [];
}
function hechosDe(materia){
  var M=(S.hechos&&S.hechos.materias)||{};
  var l=(M[materia]||[]).slice();
  var ed=S.edition;
  if(ed&&ed.hechos)ed.hechos.forEach(function(h){if(h.materia===materia&&!l.some(function(x){return x.titulo===h.titulo;}))l.unshift(Object.assign({fecha:ed.fecha},h));});
  l.sort(function(a,b){return (b.fecha||'')<(a.fecha||'')?-1:((b.fecha||'')>(a.fecha||'')?1:0);});
  return l;
}
function epocaCls(e){return String(e||'').length>6?'y sm':'y';}
function bloqueFact(m,p){
  var L=hechosDe(m.n),H=L[0];
  if(!H)return '<div class="fact" style="--c:'+colorDe(p)+'"><span class="eyebrow">Fact</span><p class="muted small">El primer fact de esta materia llega con la próxima edición.</p></div>';
  var old=L.slice(1,8);
  return '<div class="fact" style="--c:'+colorDe(p)+'"><div class="fh"><span class="eyebrow">Fact</span><span class="ep">'+esc(H.epoca||'')+'</span></div>'+
    '<h4>'+esc(H.titulo||'')+'</h4>'+figura(H.imagen)+'<p class="lead">'+linea(H.dato||'')+'</p><div class="txt">'+paras(H.explicacion)+'</div>'+fuente(H.fuente)+
    (H.fecha?'<p class="src">Fact del '+esc(fechaLarga(H.fecha))+'</p>':'')+
    (old.length?'<details><summary>Facts anteriores ('+old.length+')</summary>'+old.map(function(o){return '<div class="old"><span class="eyebrow" style="color:var(--muted)">'+esc(o.epoca||'')+'</span><b>'+esc(o.titulo||'')+'</b><p>'+linea(o.dato||'')+'</p>'+(o.explicacion?'<div class="txt">'+paras(o.explicacion)+'</div>':'')+fuente(o.fuente)+'</div>';}).join('')+'</details>':'')+
  '</div>';
}

function pasosActivos(modo){
  var ed=S.edition;
  return MODOS[modo||S.modo].pasos.map(function(p){
    if(p==='datos'&&!listaHechos(ed).length&&ed&&ed.rapido)return 'rapido';
    return p;
  }).filter(function(p){
    if(p==='libro')return !!(ed&&ed.libro);
    if(p==='materias')return !!(ed&&ed.materias&&ed.materias.length);
    if(p==='lectura')return !!(ed&&ed.lectura);
    if(p==='rapido')return !!(ed&&ed.rapido);
    if(p==='datos')return listaHechos(ed).length>0;
    return true;
  });
}
function subtitulo(p){

function radar(cnt){
  var N=PILARES.length,cx=180,cy=160,R=104,mx=Math.max(3,Math.max.apply(null,PILARES.map(function(p){return cnt[p.id];})));
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var g='';
  [1/3,2/3,1].forEach(function(k){g+='<polygon points="'+PILARES.map(function(p,i){return pt(i,R*k).join(',');}).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>';});
  PILARES.forEach(function(p,i){var e=pt(i,R);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--line)"/>';});
  var poly=PILARES.map(function(p,i){return pt(i,R*Math.max(.06,cnt[p.id]/mx)).join(',');}).join(' ');
  g+='<polygon points="'+poly+'" fill="color-mix(in srgb,var(--gold) 22%,transparent)" stroke="var(--gold)" stroke-width="2"/>';
  PILARES.forEach(function(p,i){var q=pt(i,R*Math.max(.06,cnt[p.id]/mx));g+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="'+colorDe(p)+'"/>';
    var L=pt(i,R+22);var anc=Math.abs(L[0]-cx)<8?'middle':(L[0]>cx?'start':'end');g+='<text x="'+L[0]+'" y="'+(L[1]+4)+'" text-anchor="'+anc+'">'+esc(p.n==='Ciencia y futuro'?'Ciencia':p.n)+'</text>';});
  return '<svg class="radar" viewBox="0 0 360 320" role="img" aria-label="Mapa de tu mente: materias estudiadas por pilar">'+g+'</svg>';
}

  (ed.historia.tarjetas||[]).forEach(function(c){
    var x='';if(c.tipo==='adivina')x=(c.contexto||'')+' '+c.pregunta+' Piénsalo un momento.';else if(c.tipo==='herramienta')x='La herramienta mental: '+c.nombre+'. '+c.texto;else if(c.tipo==='llevaloATuVida')x='Llévalo a tu vida. '+c.pregunta;else if(c.tipo==='paraRecordar')x='Para recordar. '+c.frase;else x=(c.titulo?c.titulo+'. ':'')+c.texto;
    q.push({t:ETQ[c.tipo]||'Historia',x:plano(x)});
  });
  (ed.materias||[]).forEach(function(m){q.push({t:m.materia,x:plano(m.materia+'. '+m.titulo+'. '+(m.contexto||'')+' '+(m.pregunta||'')+' Piénsalo. '+(m.revelacion||'')+' La idea: '+(m.idea||''))});});
  if(listaHechos(ed).length&&S.modo!=='rescate'){listaHechos(ed).forEach(function(d){q.push({t:d.materia||'Fact',x:plano((d.materia?d.materia+'. ':'')+(d.epoca?d.epoca+'. ':'')+d.titulo+'. '+d.dato+' '+(d.explicacion||''))});});}
  else if(ed.rapido&&S.modo!=='rescate')q.push({t:'Dato curioso',x:plano('Dato curioso. '+ed.rapido.dato+' '+ed.rapido.porque+' '+ed.rapido.conexion)});
  if(ed.lectura&&ed.lectura.secciones){
    var lt=ed.lectura.secciones.filter(function(s){return s.tipo==='texto'||s.tipo==='cita'||s.tipo==='subtitulo';}).map(function(s){return plano(s.texto);}).join(' ');
    q.push({t:'Lectura',x:'La lectura de hoy: '+ed.lectura.libro+'. '+(ed.lectura.capitulo&&ed.lectura.capitulo.titulo||'')+'. '+lt});
  }
  if(ed.palabra)q.push({t:'Palabra del día',x:plano('La palabra del día: '+ed.palabra.palabra+'. '+ed.palabra.definicion+' '+(ed.palabra.ejemplo||''))});
  if(ed.frances){q.push({t:'Francés',x:'La frase en francés de hoy significa: '+ed.frances.traduccion});q.push({t:'Francés',x:ed.frances.frase,l:'fr'});}
  q.push({t:'Fin',x:'Eso es todo. Abre AUXO para responder las tres preguntas del cierre.'});
  return q;
}
function podcastPlay(){
  if(!('speechSynthesis' in window)){mostrarPlayer('El audio no está disponible en este dispositivo.');return;}
  try{speechSynthesis.cancel();}catch(e){}
  P={on:true,paused:false,q:colaPodcast(),i:0};
  siguientePodcast();
}
function siguientePodcast(){
  if(!P.on)return;
  if(P.i>=P.q.length){
    P.on=false;var ed=S.edition;
    marcarPaso('noticias');marcarPaso('historia');
    if(ed.materias){marcarPaso('materias');sembrarExtras('materias');}
    if(S.modo!=='rescate'){if(listaHechos(ed).length){marcarPaso('datos');sembrarExtras('datos');}else if(ed.rapido)marcarPaso('rapido');}
    sembrarRepaso();mostrarPlayer(null);render();return;
  }
  var it=P.q[P.i];mostrarPlayer(it.t);
  decir(it.x,it.l,function(){if(!P.on||P.paused)return;P.i++;setTimeout(siguientePodcast,600);});
}
function mostrarPlayer(label){
  var el=document.getElementById('player');
  if(!P.on&&label===null){el.hidden=true;el.innerHTML='';return;}
  if(!P.on){el.hidden=false;el.innerHTML='<div class="player-in"><span class="now">'+esc(label)+'</span><button type="button" class="icon-btn" data-act="pstop" aria-label="Cerrar">'+ICON.close+'</button></div>';return;}
  el.hidden=false;
  el.innerHTML='<div class="player-in"><button type="button" class="icon-btn" data-act="ptoggle" aria-label="'+(P.paused?'Reanudar':'Pausar')+'">'+(P.paused?ICON.play:ICON.pause)+'</button><span class="now">'+esc(P.q[P.i]?P.q[P.i].t:'')+' · '+(P.i+1)+'/'+P.q.length+'</span><button type="button" class="icon-btn" data-act="pskip" aria-label="Siguiente sección">'+ICON.next+'</button><button type="button" class="icon-btn" data-act="pstop" aria-label="Detener">'+ICON.stop+'</button></div>';
}

/* ---------- Pregúntale a AUXO ---------- */
var askCtl=null;
function preguntar(){
  var A=S.flow.ask;var ta=document.getElementById('askq');A.q=ta?ta.value.trim():'';
  if(!A.q||!S.sample)return;
  var ed=S.edition;
  var ctx=(ed.historia.tarjetas||[]).map(function(c){return (ETQ[c.tipo]||'')+': '+(c.texto||c.pregunta||c.frase||'')+(c.nombre?' ('+c.nombre+')':'');}).join('\n');
  var prompt='Eres AUXO, el mentor personal de aprendizaje de Sebastián, emprendedor mexicano en Guadalajara. Responde en español claro, en 120 a 200 palabras, con frases cortas y sin emojis. Si un dato no es seguro, dilo. Termina con una pregunta breve que lo haga pensar.\n\nEpisodio de hoy: '+ed.titulo+' (temporada '+(ed.temporada&&ed.temporada.titulo||'')+').\n'+ctx.slice(0,6000)+'\n\nPregunta de Sebastián: '+A.q;
  A.busy=true;A.out='';renderFlow();
  askCtl=new AbortController();
  S.sample(prompt,{signal:askCtl.signal,cache:false,onText:function(u){A.out=u.text;var o=document.getElementById('askout');if(o)o.textContent=u.text;}})
  .then(function(r){A.out=r.text;})
  .catch(function(e){
    if(e&&e.code==='cancelled'){A.out=e.text||A.out;}
    else if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='not_declared'||e.code==='capability_disabled'||e.code==='capability_removed')){S.sample=null;A.out='';}
    else if(e&&e.code==='rate_limited'){A.out=(e.text?e.text+'\n\n':'')+'Has hecho muchas preguntas seguidas. Intenta en un rato.';}
    else{A.out=(e&&e.text?e.text+'\n\n':'')+'No se pudo completar la respuesta. Intenta de nuevo.';}
  })
  .then(function(){A.busy=false;askCtl=null;if(S.flow)renderFlow();});
}

/* ---------- Eventos ---------- */
function rerenderFlowKeep(){var f=document.getElementById('flow');var y=f.scrollTop;renderFlow();f.scrollTop=y;}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button,[data-act]');if(!b)return;
  var d=b.dataset;
  if(d.nav){S.view=d.nav;if(d.nav==='explorar')S.pilar=null;render();window.scrollTo(0,0);return;}
  if(d.pilar){S.pilar=d.pilar;S.view='explorar';render();window.scrollTo(0,0);return;}
  if(d.ed){abrirEdicion(d.ed);return;}
  if(d.modo){S.modo=d.modo;lsSet('auxo.modo',d.modo);if(S.edition&&!S.prog.completada){S.prog.modo=d.modo;guardarProg();}render();return;}
  if(d.tema){lsSet('auxo.tema',d.tema);if(d.tema==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',d.tema);render();return;}
  if(d.vel){lsSet('auxo.vel',d.vel);render();return;}
  if(d.goto){abrirFlow(d.goto,d.dt);return;}
  if(d.dt){S.flow.dt=d.dt;renderFlow();return;}
  if(d.news!==undefined){var n=+d.news;S.flow.abierta=(S.flow.abierta===n?-1:n);renderFlow();return;}
  if(d.know!==undefined){var C=S.flow.cal;var card=C.cards[C.i];responderTarjeta(card,d.know==='1');C.i++;C.show=false;renderFlow();return;}
  if(d.def!==undefined){mostrarTermino(d.term,d.def);return;}
  if(d.act==='sheetclose'){var sh=document.getElementById('sheet');sh.hidden=true;sh.innerHTML='';return;}
  if(d.lq!==undefined){
    S.prog.lecturaResp=S.prog.lecturaResp||{};
    if(typeof S.prog.lecturaResp[d.lq]==='number')return;
    S.prog.lecturaResp[d.lq]=+d.o;guardarProg();rerenderFlowKeep();return;
  }
  if(d.mopt!==undefined||d.mrev!==undefined){
    var mi=+(d.mopt!==undefined?d.mopt:d.mrev);
    S.prog.materias=S.prog.materias||{};var ms=S.prog.materias[mi]||{};
    if(d.mopt!==undefined){if(typeof ms.eleccion==='number')return;ms.eleccion=+d.o;}
    ms.visto=true;S.prog.materias[mi]=ms;guardarProg();rerenderFlowKeep();return;
  }
  if(d.guess!==undefined){S.prog.adivina=+d.guess;guardarProg();renderFlow();return;}
  if(d.q!==undefined){
    var qi=+d.q,oj=+d.o,Q=preguntasQuiz();
    S.prog.quiz=S.prog.quiz||{resp:{},bien:0,total:0};S.prog.quiz.resp=S.prog.quiz.resp||{};
    if(typeof S.prog.quiz.resp[qi]==='number')return;
    S.prog.quiz.resp[qi]=oj;S.prog.quiz.total=Object.keys(S.prog.quiz.resp).length;
    S.prog.quiz.bien=Object.keys(S.prog.quiz.resp).filter(function(k){return Q[k]&&S.prog.quiz.resp[k]===Q[k].correcta;}).length;
    guardarProg();rerenderFlowKeep();return;
  }
  switch(d.act){
    case 'start':abrirFlow();break;
    case 'hoy':cargar();window.scrollTo(0,0);break;
    case 'pilares':S.pilar=null;render();window.scrollTo(0,0);break;
    case 'repaso':abrirRepasoLibre();break;
    case 'close':capturarTextos();if(askCtl)askCtl.abort();cerrarFlow();S.progTodo=null;cargarRepaso().then(function(){cargarSemana().then(render);});break;
    case 'reveal':S.flow.cal.show=true;renderFlow();break;
    case 'cardnext':capturarTextos();S.flow.card++;S.flow.ask.out='';renderFlow();break;
    case 'cardprev':capturarTextos();S.flow.card=Math.max(0,S.flow.card-1);renderFlow();break;
    case 'nextstep':siguientePaso();break;
    case 'sayfr':if(S.edition.frances){try{speechSynthesis.cancel();}catch(e){}decir(S.edition.frances.frase,'fr');}break;
    case 'saypw':if(S.edition.palabra){try{speechSynthesis.cancel();}catch(e){}decir(S.edition.palabra.palabra+'. '+plano(S.edition.palabra.definicion),'es');}break;
    case 'podcast':podcastPlay();break;
    case 'ptoggle':try{if(P.paused){P.paused=false;speechSynthesis.cancel();siguientePodcast();}else{P.paused=true;speechSynthesis.cancel();}}catch(e){}mostrarPlayer('');break;
    case 'pskip':try{P.paused=false;speechSynthesis.cancel();}catch(e){}P.i++;siguientePodcast();break;
    case 'pstop':P.on=false;try{speechSynthesis.cancel();}catch(e){}mostrarPlayer(null);break;
    case 'askopen':S.flow.ask.open=true;renderFlow();var t=document.getElementById('askq');if(t)t.focus();break;
    case 'ask':preguntar();break;
    case 'askstop':if(askCtl)askCtl.abort();break;
    case 'export':exportar();break;
  }
});
function capturarTextos(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  var v=g('vida');if(v!==null){S.prog.vida=v;guardarProg();}
}
function siguientePaso(){
  capturarTextos();
  var F=S.flow,p=F.pasos[F.i];
  if(p==='repasoLibre'){cerrarFlow();return;}
  marcarPaso(p);
  if(p==='historia'||p==='cierre')sembrarRepaso();
  if(p==='materias'||p==='lectura'||p==='datos')sembrarExtras(p);
  F.i++;F.card=0;F.dt=0;
  if(F.i>=F.pasos.length){finDelDia();return;}
  renderFlow();
}
function exportar(){
  var msg=document.getElementById('exp-msg');
  Promise.all([S.db.collection('progress').get(),S.db.collection('review').get()]).then(function(r){
    var data={exportado:new Date().toISOString(),progreso:r[0].docs.map(function(d){return d.data();}),repaso:r[1].docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;return x;})};
    return S.downloads.save({filename:'auxo-mis-datos-'+hoy()+'.json',data:JSON.stringify(data,null,2)});
  }).then(function(){if(msg)msg.textContent='Descarga lista.';}).catch(function(){if(msg)msg.textContent='No se descargó. Intenta de nuevo.';});
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){var sh=document.getElementById('sheet');if(!sh.hidden){sh.hidden=true;sh.innerHTML='';return;}}
  if(!S.flow||S.flow.pasos[S.flow.i]!=='historia')return;

var tx=null;
document.addEventListener('touchstart',function(e){if(S.flow&&e.target.closest('#story,.dato'))tx=e.touches[0].clientX;else tx=null;},{passive:true});

/* ---------- Inicio (app independiente) ---------- */
function crearDB(){
  var LS='auxo.db.';var cache={};
  function fetchJSON(p){if(!cache[p]){cache[p]=fetch(p+(p.indexOf('?')<0?'?v=':'&v=')+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}return cache[p];}
  function snap(id,d){return {id:id,exists:d!=null,data:function(){return d==null?undefined:d;}};}
  function lsAll(col){var out=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(LS+col+'/')===0){out.push({id:k.slice((LS+col+'/').length),data:JSON.parse(localStorage.getItem(k))});}}}catch(e){}return out;}
  var remoto={editions:1,meta:1};
  function doc(path){
    var p=path.split('/'),col=p[0],id=p[1];
    return {id:id,path:path,
      get:function(){
        if(remoto[col])return fetchJSON(col+'/'+id+'.json').then(function(d){return snap(id,d);});
        var v=null;try{v=JSON.parse(localStorage.getItem(LS+path));}catch(e){}
        return Promise.resolve(snap(id,v));
      },
      set:function(d){
        if(remoto[col])return Promise.resolve();
        try{localStorage.setItem(LS+path,JSON.stringify(d));}catch(e){return Promise.reject({code:'quota_exceeded'});}
        return Promise.resolve();
      }
    };
  }
  function query(col,filtros,orden,lim){
    return {
      where:function(f,op,v){return query(col,filtros.concat([[f,op,v]]),orden,lim);},
      orderBy:function(f,d){return query(col,filtros,[f,d||'asc'],lim);},
      limit:function(n){return query(col,filtros,orden,n);},
      get:function(){
        var base;
        if(col==='editions'){
          base=fetchJSON('editions/index.json').then(function(ix){
            var ids=((ix&&ix.ediciones)||[]).slice().sort().reverse();
            if(lim)ids=ids.slice(0,lim);
            return Promise.all(ids.map(function(id){return fetchJSON('editions/'+id+'.json').then(function(d){return {id:id,data:d};});}));
          });
        }else base=Promise.resolve(lsAll(col));
        return base.then(function(rows){
          rows=rows.filter(function(r){return r.data&&filtros.every(function(f){var x=r.data[f[0]];switch(f[1]){case '>=':return x>=f[2];case '<=':return x<=f[2];case '==':return x===f[2];case '>':return x>f[2];case '<':return x<f[2];}return true;});});
          if(orden)rows.sort(function(a,b){var x=a.data[orden[0]],y=b.data[orden[0]];var c=x<y?-1:(x>y?1:0);return orden[1]==='desc'?-c:c;});
          if(lim)rows=rows.slice(0,lim);
          var docs=rows.map(function(r){return snap(r.id,r.data);});
          return {docs:docs,size:docs.length,empty:!docs.length};
        });
      }
    };
  }
  return {reset:function(){cache={};},doc:doc,collection:function(col){var q=query(col,[],null,0);q.doc=function(id){return doc(col+'/'+id);};return q;}};
}
var descargas={save:function(o){
  try{var b=new Blob([o.data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);return Promise.resolve();}
  catch(e){return Promise.reject(e);}
}};
document.addEventListener('change',function(ev){
  if(!ev.target||ev.target.id!=='imp'||!ev.target.files||!ev.target.files[0])return;
  var msg=document.getElementById('exp-msg');
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result),n=0;
      (d.progreso||[]).forEach(function(p){if(p&&p.fecha){localStorage.setItem('auxo.db.progress/'+p.fecha,JSON.stringify(p));n++;}});
      (d.repaso||[]).forEach(function(r){if(r&&r.id){var x=Object.assign({},r);delete x.id;localStorage.setItem('auxo.db.review/'+r.id,JSON.stringify(x));n++;}});
      if(msg)msg.textContent='Importados '+n+' registros.';
      cargar();
    }catch(e){if(msg)msg.textContent='Ese archivo no es una copia de AUXO.';}
  };
  fr.readAsText(ev.target.files[0]);
});

  if(S.flow||S.deArchivo||S.estado!=='listo')return;
  if(document.visibilityState&&document.visibilityState!=='visible')return;

  if(f!==cargadoEl||!S.edition||S.edition.fecha!==f){cargadoEl=f;if(S.db&&S.db.reset)S.db.reset();cargar();}
}

setInterval(revisarNueva,15*60*1000);

renderNav();
S.db=crearDB();S.sample=null;S.downloads=descargas;
cargar();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
