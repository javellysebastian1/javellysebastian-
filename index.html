<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUXO</title>
<meta name="description" content="Tu ruta diaria para una mente culta.">
<meta name="theme-color" content="#2A1E44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AUXO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: una sola columna de lectura (máx. 560px), navegación inferior fija, recorrido guiado a pantalla completa. */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --sunken:#ECE8F0; --fg:#17151C; --muted:#5E5A66; --line:#D6D1DC;
  --accent:#4E2F8C; --accent-fg:#FFFFFF; --chip:#ECE6F5; --chip-fg:#4E2F8C;
  --deep:#2A1E44; --deep-2:#3B2D5A; --deep-line:#5A4A7A; --deep-fg:#FFFFFF; --deep-muted:#CBBEE6; --deep-soft:#E6DEF5;
  --ok-bg:#E6F2EC; --ok:#1F6B4A; --ok-fg:#124430; --bad-bg:#F8E9E4; --bad:#A34A2E; --bad-fg:#6E2C17;
  --serif:'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1E1B24; --sunken:#2A2632; --fg:#F1EEF5; --muted:#ADA6B8; --line:#3A3544;
  --accent:#B9A0EC; --accent-fg:#1A1226; --chip:#2E2540; --chip-fg:#CDBBF5;
  --deep:#2A1E44; --deep-2:#3B2D5A; --deep-line:#5A4A7A; --deep-fg:#FFFFFF; --deep-muted:#CBBEE6; --deep-soft:#E6DEF5;
  --ok-bg:#16301F; --ok:#5FBF8C; --ok-fg:#BFE8D0; --bad-bg:#3A1F17; --bad:#E08A6B; --bad-fg:#F5CDBD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1E1B24; --sunken:#2A2632; --fg:#F1EEF5; --muted:#ADA6B8; --line:#3A3544;
  --accent:#B9A0EC; --accent-fg:#1A1226; --chip:#2E2540; --chip-fg:#CDBBF5;
  --deep:#2A1E44; --deep-2:#3B2D5A; --deep-line:#5A4A7A; --deep-fg:#FFFFFF; --deep-muted:#CBBEE6; --deep-soft:#E6DEF5;
  --ok-bg:#16301F; --ok:#5FBF8C; --ok-fg:#BFE8D0; --bad-bg:#3A1F17; --bad:#E08A6B; --bad-fg:#F5CDBD; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
p{margin:0;overflow-wrap:anywhere}
button,a,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.serif{font-family:var(--serif);font-weight:400}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{min-height:52px;border:0;border-radius:26px;padding:0 22px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn-light{background:#FFFFFF;color:#2A1E44}
.btn-outline-deep{background:transparent;border:1px solid var(--deep-line);color:var(--deep-fg)}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.card{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
svg{flex:none}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.04em}

/* Héroe de temporada */
.hero{background:var(--deep);color:var(--deep-fg);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:var(--deep-muted)}
.hero h1{font-family:var(--serif);font-size:38px;line-height:1.05}
.hero p{color:var(--deep-soft)}
.ticks{display:flex;gap:4px}
.ticks span{width:16px;height:4px;border-radius:2px;background:var(--deep-line)}
.ticks span.on{background:#FFFFFF}

/* Lista de la ruta */
.route{display:flex;flex-direction:column;gap:8px}
.route-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:16px;border:2px solid transparent;text-align:left;width:100%}
.route-item.next{border-color:var(--accent)}
.dot{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--sunken);color:var(--accent);flex:none}
.route-item.done .dot{background:var(--accent);color:var(--accent-fg)}
.route-item .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.route-item.done .t1{color:var(--muted)}
.t1{font-weight:600}
.t2{font-size:13px;color:var(--muted);line-height:1.35}
.mins{font-size:13px;font-weight:600;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

/* Selector de modo */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--sunken);border-radius:16px}
.seg button{min-height:54px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(23,21,28,.14)}
.seg b{font-size:14px}
.seg span{font-size:12px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.week i{width:30px;height:30px;border-radius:15px;background:var(--sunken);display:flex;align-items:center;justify-content:center}
.week i.on{background:var(--accent);color:var(--accent-fg)}
.week i.today{box-shadow:inset 0 0 0 2px var(--accent)}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Recorrido */
.flow{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flow.deep{background:var(--deep);color:var(--deep-fg)}
.flow-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:12px 28px}
.bar{display:grid;gap:4px}
.bar span{height:4px;border-radius:2px;background:var(--line)}
.bar span.on{background:var(--accent)}
.deep .bar span{background:var(--deep-line)}
.deep .bar span.on{background:#FFFFFF}
.flow-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flow-top .lbl{font-size:13px;color:var(--muted);text-align:center;flex:1}
.deep .flow-top .lbl{color:var(--deep-muted)}
.flow h2{font-family:var(--serif);font-size:36px;line-height:1.06}
.flow-foot{margin-top:auto;display:flex;gap:10px;padding-top:12px}
.flow-foot .btn{flex:1}

/* Tarjetas de repaso */
.flash{background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:220px}
.flash .q{font-size:20px;font-weight:600;line-height:1.35}
.flash .a{padding:14px 16px;border-radius:14px;background:var(--sunken)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}

/* Noticias */
.news{background:var(--surface);border-radius:20px;overflow:hidden}
.news-head{width:100%;border:0;background:transparent;text-align:left;padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.news-head .h{display:flex;flex-direction:column;gap:6px;min-width:0}
.news-head b{font-size:18px;line-height:1.3}
.news-body{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:12px;background:var(--chip);color:var(--chip-fg);font-size:12px;font-weight:700}
.chip.plain{background:var(--sunken);color:var(--muted)}
.blk{display:flex;flex-direction:column;gap:4px}
.blk .eyebrow{font-size:11px}
.amq{background:var(--deep);color:var(--deep-fg);border-radius:14px;padding:14px 16px}
.amq .eyebrow{color:var(--deep-muted)}
.prev{padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:14px;color:var(--muted)}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--accent)}

/* Historia */
.story-tag{align-self:flex-start;padding:6px 12px;border-radius:14px;background:var(--deep-2);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--deep-soft)}
.story-body{display:flex;flex-direction:column;gap:16px;font-size:18px;line-height:1.6;color:var(--deep-soft)}
.story-body h3{font-family:var(--serif);font-size:30px;line-height:1.1;color:#FFFFFF}
.opt{min-height:56px;padding:14px 18px;border:1px solid var(--deep-line);border-radius:16px;background:#33264F;color:#FFFFFF;text-align:left;font-size:16px;font-weight:500;width:100%}
.opt[aria-pressed="true"]{background:#FFFFFF;color:#2A1E44;border-color:#FFFFFF}
.recall{padding:12px 14px;border-radius:12px;background:var(--deep-2);font-size:15px}
.quote{font-family:var(--serif);font-style:italic;font-size:32px;line-height:1.15;color:#FFFFFF}
.deep textarea{background:#33264F;border-color:var(--deep-line);color:#FFFFFF}
.deep textarea::placeholder{color:var(--deep-muted)}
.deep a{color:#E6DEF5}
.ask{border-top:1px solid var(--deep-line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ask-out{white-space:pre-wrap;font-size:16px;line-height:1.55;color:var(--deep-soft)}

/* Formularios */
label{font-size:14px;font-weight:600}
textarea,input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;line-height:1.4;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}

/* Quiz */
.qz{display:flex;flex-direction:column;gap:10px}
.qz .qopt{min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%;font-size:15px;line-height:1.35;display:flex;align-items:center;justify-content:space-between;gap:10px}
.qz .qopt.right{background:var(--ok-bg);border:2px solid var(--ok);color:var(--ok-fg);font-weight:600}
.qz .qopt.wrong{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad-fg)}
.feedback{padding:14px 16px;border-radius:14px;background:var(--sunken);font-size:15px}

/* Francés */
.fr{background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.fr .phrase{font-family:var(--serif);font-size:32px;line-height:1.15}

/* Reproductor */
.player{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player-in{max-width:560px;margin:0 auto;background:var(--deep);color:#FFFFFF;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.player-in .now{flex:1;min-width:0;font-size:13px;color:var(--deep-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-in select{background:var(--deep-2);color:#FFFFFF;border:0;border-radius:10px;min-height:36px;padding:0 6px}

.season-ep{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.season-ep:first-of-type{border-top:0}
.notice{padding:14px 16px;border-radius:14px;background:var(--chip);color:var(--chip-fg);font-size:14px}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* Imágenes */
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img{width:100%;max-height:340px;object-fit:cover;border-radius:16px;display:block;background:var(--sunken);color:transparent;min-height:120px}
.fig figcaption{font-size:12px;line-height:1.4;color:var(--muted)}
.deep .fig figcaption,.hero .fig figcaption{color:var(--deep-muted)}
.hero .fig img{max-height:220px}
/* Palabras con explicación */
.term{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted 2px;text-decoration-color:var(--accent);text-underline-offset:4px}
.deep .term{text-decoration-color:#CBBEE6}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;background:var(--surface);color:var(--fg);border-radius:20px;padding:18px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.sheet-in b{font-family:var(--serif);font-weight:400;font-size:24px}
/* Lector */
.lect{display:flex;flex-direction:column;gap:20px}
.lect .txt{font-size:18px;line-height:1.75;display:flex;flex-direction:column;gap:16px}
.lect .cita{margin:8px 0;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:10px}
.lect .cita p{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.3}
.lect .cita span{font-size:13px;color:var(--muted)}
.lect details{background:var(--surface);border-radius:16px;padding:14px 18px}
.lect summary{cursor:pointer;font-weight:600;min-height:28px}
.lect details[open] summary{margin-bottom:8px}
.chap{display:flex;gap:6px;flex-wrap:wrap}
.llevar{background:var(--deep);color:#FFFFFF;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.llevar .eyebrow{color:var(--deep-muted)}
.llevar ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--deep-soft)}
.hoy-chips{display:flex;flex-wrap:wrap;gap:6px}
.hoy-chips span{padding:4px 10px;border-radius:12px;background:var(--deep-2);color:var(--deep-soft);font-size:12px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div id="app" class="wrap" aria-live="polite">
  <div class="top"><div class="brand"><b>AUXO</b><span class="muted small">Crecer, cada día</span></div></div>
  <div class="card"><p class="eyebrow">Cargando</p><p>Abriendo la edición de hoy…</p></div>
</div>
<nav class="nav" aria-label="Principal"><div class="nav-in" id="nav"></div></nav>
<div id="player" class="player" hidden></div>
<div id="flow" class="flow" hidden></div>
<div id="sheet" class="sheet" hidden></div>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function enriquecer(h){
  return h.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,function(m,a,b){return '<button type="button" class="term" data-term="'+a+'" data-def="'+b+'">'+a+'</button>';})
          .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
          .replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>');
}
function paras(s){return String(s||'').split(/\n\s*\n/).map(function(p){return '<p>'+enriquecer(esc(p)).replace(/\n/g,'<br>')+'</p>';}).join('');}
function linea(s){return enriquecer(esc(s));}

    ((img.pie||img.credito)?'<figcaption>'+esc(img.pie||'')+(img.credito?(img.pie?' · ':'')+esc(img.credito):'')+'</figcaption>':'')+'</figure>';
}
function hoy(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function sumarDias(f,n){var d=new Date(f+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function lunes(f){var d=new Date(f+'T12:00:00Z');var w=(d.getUTCDay()+6)%7;return sumarDias(f,-w);}
function fechaLarga(f){try{return new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(f+'T12:00:00Z'));}catch(e){return f;}}

};

/* ---------- Datos ---------- */
function progRef(){return S.db.doc('progress/'+S.edition.fecha);}
var saveT=null;
function guardarProg(){
  if(!S.db||!S.edition)return;
  S.prog.fecha=S.edition.fecha;S.prog.edicion=S.edition.id;S.prog.actualizado=new Date().toISOString();
  clearTimeout(saveT);
  saveT=setTimeout(function(){progRef().set(JSON.parse(JSON.stringify(S.prog))).catch(function(){});},400);
}
function marcarPaso(p){
  S.prog.pasos=S.prog.pasos||{};
  if(S.prog.pasos[p])return;
  S.prog.pasos[p]=true;
  var req=MODOS[S.prog.modo||S.modo].pasos.filter(function(x){return x!=='libro'||S.edition.libro;});
  S.prog.completada=req.every(function(x){return S.prog.pasos[x];});
  guardarProg();
}

function cargar(){
  var f=hoy();
  return S.db.doc('editions/'+f).get().then(function(s){
    if(s.exists)return s.data();
    return S.db.collection('editions').orderBy('fecha','desc').limit(1).get().then(function(q){return q.empty?null:q.docs[0].data();});
  }).then(function(ed){
    S.edition=ed;
    var tasks=[S.db.doc('meta/temporadas').get().then(function(s){S.temporadas=s.exists?s.data():null;})];
    if(ed){tasks.push(S.db.doc('progress/'+ed.fecha).get().then(function(s){S.prog=s.exists?JSON.parse(JSON.stringify(s.data())):{};if(S.prog.modo&&MODOS[S.prog.modo])S.modo=S.prog.modo;}));}
    tasks.push(cargarSemana());
    tasks.push(cargarRepaso());
    return Promise.all(tasks);
  }).then(function(){S.estado='listo';render();})
  .catch(function(e){S.estado='error';S.error=(e&&e.code)||'unavailable';render();});
}
function cargarSemana(){
  var l=lunes(hoy());
  return S.db.collection('progress').where('fecha','>=',l).get().then(function(q){S.semana=q.docs.map(function(d){return d.data();});}).catch(function(){S.semana=[];});
}
function cargarRepaso(){
  return S.db.collection('review').where('proxima','<=',hoy()).orderBy('proxima','asc').limit(30).get().then(function(q){
    S.pendientes=q.docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;return x;}).filter(function(x){return !x.archivada;});
  }).catch(function(){S.pendientes=[];});
}
function tarjetasCalentamiento(){
  var c=S.pendientes.slice(0,3);
  if(c.length<3&&S.edition&&S.edition.calentamiento){
    S.edition.calentamiento.forEach(function(x,i){
      if(c.length>=3)return;
      var id='cal-'+S.edition.fecha+'-'+i;
      if(c.some(function(y){return y.id===id;}))return;
      c.push({id:id,pregunta:x.pregunta,respuesta:x.respuesta,origen:x.origen||'',intervalo:-1,nueva:true});
    });
  }
  return c;
}
function responderTarjeta(card,sabia){
  if(!S.db)return;
  var f=hoy();var iv=typeof card.intervalo==='number'?card.intervalo:-1;
  var doc={pregunta:card.pregunta,respuesta:card.respuesta,origen:card.origen||'',ultima:f};
  if(sabia){iv=iv+1;if(iv>=INTERVALOS.length){doc.archivada=true;doc.intervalo=iv;doc.proxima='9999-12-31';}else{doc.intervalo=iv;doc.proxima=sumarDias(f,INTERVALOS[iv]);doc.archivada=false;}}
  else{doc.intervalo=0;doc.proxima=sumarDias(f,1);doc.archivada=false;}
  S.prog.repaso=S.prog.repaso||{bien:0,total:0};
  S.prog.repaso.total++;if(sabia)S.prog.repaso.bien++;
  guardarProg();
  S.pendientes=S.pendientes.filter(function(x){return x.id!==card.id;});
  return S.db.doc('review/'+card.id).set(doc).catch(function(){});
}
function sembrarRepaso(){
  if(!S.db||!S.edition||S.prog.repasoSembrado)return;
  var ed=S.edition,f=hoy(),items=[];
  (ed.historia&&ed.historia.repaso||[]).forEach(function(r,i){items.push({id:'h-'+ed.fecha+'-'+i,r:r});});
  if(ed.frances&&ed.frances.repaso)items.push({id:'f-'+ed.fecha,r:ed.frances.repaso});
  items.forEach(function(it){
    var ref=S.db.doc('review/'+it.id);
    ref.get().then(function(s){if(!s.exists)return ref.set({pregunta:it.r.pregunta,respuesta:it.r.respuesta,origen:ed.fecha,intervalo:-1,proxima:sumarDias(f,1),archivada:false});}).catch(function(){});
  });
  S.prog.repasoSembrado=true;guardarProg();
}

function pasosActivos(){

  if(p==='historia')return ed.titulo;
  if(p==='rapido')return ed.rapido?ed.rapido.titulo||ed.rapido.dato:'';
  if(p==='cierre')return ed.frances?'« '+ed.frances.frase+' » y 3 preguntas':'3 preguntas';
  if(p==='libro')return ed.libro?ed.libro.titulo:'';
  if(p==='materias')return (ed.materias||[]).map(function(m){return m.materia;}).join(' · ');

function vistaSemana(){
  var l=lunes(hoy()),f=hoy();

  var letras=['L','M','M','J','V','S','D'];
  var wk=letras.map(function(L,i){var d=sumarDias(l,i);var p=porFecha[d];var on=p&&p.completada;return '<div><i class="'+(on?'on':'')+(d===f?' today':'')+'">'+(on?ICON.check:'')+'</i>'+L+'</div>';}).join('');

    q.push({t:'Lectura',x:'La lectura de hoy: '+ed.lectura.libro+'. '+(ed.lectura.capitulo&&ed.lectura.capitulo.titulo||'')+'. '+lt});
  }
  if(ed.rapido&&S.modo==='largo')q.push({t:'El rápido',x:'El rápido. '+ed.rapido.dato+' '+ed.rapido.porque+' '+ed.rapido.conexion});
  if(ed.frances){q.push({t:'Francés',x:'La frase en francés de hoy significa: '+ed.frances.traduccion});q.push({t:'Francés',x:ed.frances.frase,l:'fr'});}
  q.push({t:'Fin',x:'Eso es todo. Abre AUXO para responder las tres preguntas del cierre.'});
  return q;
}
function podcastPlay(){
  if(!('speechSynthesis' in window)){mostrarPlayer('El audio no está disponible en este dispositivo.');return;}
  try{speechSynthesis.cancel();}catch(e){}
  P={on:true,paused:false,q:colaPodcast(),i:0};
  siguientePodcast();
}
function siguientePodcast(){
  if(!P.on)return;
  if(P.i>=P.q.length){P.on=false;marcarPaso('noticias');marcarPaso('historia');if(S.edition.materias){marcarPaso('materias');sembrarExtras('materias');}if(S.modo==='largo')marcarPaso('rapido');sembrarRepaso();mostrarPlayer(null);render();return;}
  var it=P.q[P.i];mostrarPlayer(it.t);
  decir(it.x,it.l,function(){if(!P.on||P.paused)return;P.i++;setTimeout(siguientePodcast,600);});
}
function mostrarPlayer(label){
  var el=document.getElementById('player');
  if(!P.on&&label===null){el.hidden=true;el.innerHTML='';return;}
  if(!P.on){el.hidden=false;el.innerHTML='<div class="player-in"><span class="now">'+esc(label)+'</span><button type="button" class="icon-btn" data-act="pstop" aria-label="Cerrar">'+ICON.close+'</button></div>';return;}
  el.hidden=false;
  el.innerHTML='<div class="player-in"><button type="button" class="icon-btn" data-act="ptoggle" aria-label="'+(P.paused?'Reanudar':'Pausar')+'">'+(P.paused?ICON.play:ICON.pause)+'</button><span class="now">'+esc(P.q[P.i]?P.q[P.i].t:'')+' · '+(P.i+1)+'/'+P.q.length+'</span><button type="button" class="icon-btn" data-act="pskip" aria-label="Siguiente sección">'+ICON.next+'</button><button type="button" class="icon-btn" data-act="pstop" aria-label="Detener">'+ICON.stop+'</button></div>';
}

/* ---------- Pregúntale a AUXO ---------- */
var askCtl=null;
function preguntar(){
  var A=S.flow.ask;var ta=document.getElementById('askq');A.q=ta?ta.value.trim():'';
  if(!A.q||!S.sample)return;
  var ed=S.edition;
  var ctx=(ed.historia.tarjetas||[]).map(function(c){return (ETQ[c.tipo]||'')+': '+(c.texto||c.pregunta||c.frase||'')+(c.nombre?' ('+c.nombre+')':'');}).join('\n');
  var prompt='Eres AUXO, el mentor personal de aprendizaje de Sebastián, emprendedor mexicano en Guadalajara. Responde en español claro, en 120 a 200 palabras, con frases cortas y sin emojis. Si un dato no es seguro, dilo. Termina con una pregunta breve que lo haga pensar.\n\nEpisodio de hoy: '+ed.titulo+' (temporada '+(ed.temporada&&ed.temporada.titulo||'')+').\n'+ctx.slice(0,6000)+'\n\nPregunta de Sebastián: '+A.q;
  A.busy=true;A.out='';renderFlow();
  askCtl=new AbortController();
  S.sample(prompt,{signal:askCtl.signal,cache:false,onText:function(u){A.out=u.text;var o=document.getElementById('askout');if(o)o.textContent=u.text;}})
  .then(function(r){A.out=r.text;})
  .catch(function(e){
    if(e&&e.code==='cancelled'){A.out=e.text||A.out;}
    else if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='not_declared'||e.code==='capability_disabled'||e.code==='capability_removed')){S.sample=null;A.out='';}
    else if(e&&e.code==='rate_limited'){A.out=(e.text?e.text+'\n\n':'')+'Has hecho muchas preguntas seguidas. Intenta en un rato.';}
    else{A.out=(e&&e.text?e.text+'\n\n':'')+'No se pudo completar la respuesta. Intenta de nuevo.';}
  })
  .then(function(){A.busy=false;askCtl=null;if(S.flow)renderFlow();});
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button,[data-act]');if(!b)return;
  var d=b.dataset;
  if(d.nav){S.view=d.nav;render();window.scrollTo(0,0);return;}
  if(d.modo){S.modo=d.modo;lsSet('auxo.modo',d.modo);if(S.edition&&!S.prog.completada){S.prog.modo=d.modo;guardarProg();}render();return;}
  if(d.tema){if(d.tema==='auto'){document.documentElement.removeAttribute('data-theme');lsSet('auxo.tema','');}else{document.documentElement.setAttribute('data-theme',d.tema);lsSet('auxo.tema',d.tema);}render();return;}
  if(d.vel){lsSet('auxo.vel',d.vel);render();return;}
  if(d.goto){abrirFlow(d.goto);return;}
  if(d.news!==undefined){var n=+d.news;S.flow.abierta=(S.flow.abierta===n?-1:n);renderFlow();return;}
  if(d.know!==undefined){var C=S.flow.cal;var card=C.cards[C.i];responderTarjeta(card,d.know==='1');C.i++;C.show=false;renderFlow();return;}
  if(d.def!==undefined){mostrarTermino(d.term,d.def);return;}
  if(d.act==='sheetclose'){var sh=document.getElementById('sheet');sh.hidden=true;sh.innerHTML='';return;}
  if(d.lq!==undefined){
    S.prog.lecturaResp=S.prog.lecturaResp||{};
    if(typeof S.prog.lecturaResp[d.lq]==='number')return;
    S.prog.lecturaResp[d.lq]=+d.o;guardarProg();
    var ly=document.getElementById('flow').scrollTop;renderFlow();document.getElementById('flow').scrollTop=ly;return;
  }
  if(d.mopt!==undefined||d.mrev!==undefined){
    var mi=+(d.mopt!==undefined?d.mopt:d.mrev);
    S.prog.materias=S.prog.materias||{};var ms=S.prog.materias[mi]||{};
    if(d.mopt!==undefined){if(typeof ms.eleccion==='number')return;ms.eleccion=+d.o;}
    ms.visto=true;S.prog.materias[mi]=ms;guardarProg();
    var yy=document.getElementById('flow').scrollTop;renderFlow();document.getElementById('flow').scrollTop=yy;return;
  }
  if(d.guess!==undefined){S.prog.adivina=+d.guess;guardarProg();renderFlow();return;}
  if(d.q!==undefined){
    var qi=+d.q,oj=+d.o,Q=preguntasQuiz();
    S.prog.quiz=S.prog.quiz||{resp:{},bien:0,total:0};S.prog.quiz.resp=S.prog.quiz.resp||{};
    if(typeof S.prog.quiz.resp[qi]==='number')return;
    S.prog.quiz.resp[qi]=oj;S.prog.quiz.total=Object.keys(S.prog.quiz.resp).length;
    S.prog.quiz.bien=Object.keys(S.prog.quiz.resp).filter(function(k){return Q[k]&&S.prog.quiz.resp[k]===Q[k].correcta;}).length;
    guardarProg();var y=document.getElementById('flow').scrollTop;renderFlow();document.getElementById('flow').scrollTop=y;return;
  }
  switch(d.act){
    case 'start':abrirFlow();break;
    case 'repaso':abrirRepasoLibre();break;
    case 'close':capturarTextos();if(askCtl)askCtl.abort();cerrarFlow();cargarRepaso().then(function(){cargarSemana().then(render);});break;
    case 'reveal':S.flow.cal.show=true;renderFlow();break;
    case 'cardnext':capturarTextos();S.flow.card++;S.flow.ask.out='';renderFlow();break;
    case 'cardprev':capturarTextos();S.flow.card=Math.max(0,S.flow.card-1);renderFlow();break;
    case 'nextstep':siguientePaso();break;
    case 'sayfr':if(S.edition.frances){try{speechSynthesis.cancel();}catch(e){}decir(S.edition.frances.frase,'fr');}break;
    case 'podcast':podcastPlay();break;
    case 'ptoggle':try{if(P.paused){P.paused=false;speechSynthesis.cancel();siguientePodcast();}else{P.paused=true;speechSynthesis.cancel();}}catch(e){}mostrarPlayer('');break;
    case 'pskip':try{P.paused=false;speechSynthesis.cancel();}catch(e){}P.i++;siguientePodcast();break;
    case 'pstop':P.on=false;try{speechSynthesis.cancel();}catch(e){}mostrarPlayer(null);break;
    case 'askopen':S.flow.ask.open=true;renderFlow();var t=document.getElementById('askq');if(t)t.focus();break;
    case 'ask':preguntar();break;
    case 'askstop':if(askCtl)askCtl.abort();break;
    case 'export':exportar();break;
  }
});
function capturarTextos(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  var v=g('vida');if(v!==null)S.prog.vida=v;
  var x=g('expl');if(x!==null)S.prog.explicacion=x;
  var b1=g('b1');if(b1!==null){S.prog.bitacora={relevante:b1,conexion:g('b2')||'',accion:g('b3')||''};}
  var lp=g('lpag'),li=g('lidea');if(lp!==null||li!==null){S.prog.lectura={pagina:lp||'',idea:li||''};}
  if(v!==null||x!==null||b1!==null||lp!==null||li!==null)guardarProg();
}
function siguientePaso(){
  capturarTextos();
  var F=S.flow,p=F.pasos[F.i];
  if(p==='repasoLibre'){cerrarFlow();return;}
  marcarPaso(p);
  if(p==='historia')sembrarRepaso();
  if(p==='materias'||p==='lectura')sembrarExtras(p);
  F.i++;F.card=0;
  if(F.i>=F.pasos.length){finDelDia();return;}
  renderFlow();
}
function exportar(){
  var msg=document.getElementById('exp-msg');
  Promise.all([S.db.collection('progress').get(),S.db.collection('review').get()]).then(function(r){
    var data={exportado:new Date().toISOString(),progreso:r[0].docs.map(function(d){return d.data();}),repaso:r[1].docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;return x;})};
    return S.downloads.save({filename:'auxo-mis-datos-'+hoy()+'.json',data:JSON.stringify(data,null,2)});
  }).then(function(){if(msg)msg.textContent='Descarga lista.';}).catch(function(){if(msg)msg.textContent='No se descargó. Intenta de nuevo.';});
}
document.addEventListener('input',function(ev){
  if(ev.target&&ev.target.id&&['vida','expl','b1','b2','b3','lpag','lidea'].indexOf(ev.target.id)>=0){clearTimeout(window.__t);window.__t=setTimeout(capturarTextos,800);}
});
document.addEventListener('keydown',function(ev){
  if(!S.flow||S.flow.pasos[S.flow.i]!=='historia')return;
  if(ev.target&&(ev.target.tagName==='TEXTAREA'||ev.target.tagName==='INPUT'))return;
  if(ev.key==='ArrowRight'){var bn=document.querySelector('[data-act="cardnext"]');if(bn)bn.click();}
  if(ev.key==='ArrowLeft'){var bp=document.querySelector('[data-act="cardprev"]');if(bp&&!bp.disabled)bp.click();}
});
/* Deslizar entre tarjetas de la historia */
var tx=null;
document.addEventListener('touchstart',function(e){if(S.flow&&S.flow.pasos[S.flow.i]==='historia'&&e.target.closest('#story'))tx=e.touches[0].clientX;else tx=null;},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<60)return;var s=document.querySelector(dx<0?'[data-act="cardnext"]':'[data-act="cardprev"]');if(s&&!s.disabled)s.click();},{passive:true});

/* ---------- Inicio (app independiente) ---------- */
function crearDB(){
  var LS='auxo.db.';var cache={};
  function fetchJSON(p){if(!cache[p]){cache[p]=fetch(p,{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}return cache[p];}
  function snap(id,d){return {id:id,exists:d!=null,data:function(){return d==null?undefined:d;}};}
  function lsAll(col){var out=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(LS+col+'/')===0){out.push({id:k.slice((LS+col+'/').length),data:JSON.parse(localStorage.getItem(k))});}}}catch(e){}return out;}
  var remoto={editions:1,meta:1};
  function doc(path){
    var p=path.split('/'),col=p[0],id=p[1];
    return {id:id,path:path,
      get:function(){
        if(remoto[col])return fetchJSON(col+'/'+id+'.json').then(function(d){return snap(id,d);});
        var v=null;try{v=JSON.parse(localStorage.getItem(LS+path));}catch(e){}
        return Promise.resolve(snap(id,v));
      },
      set:function(d){
        if(remoto[col])return Promise.resolve();
        try{localStorage.setItem(LS+path,JSON.stringify(d));}catch(e){return Promise.reject({code:'quota_exceeded'});}
        return Promise.resolve();
      }
    };
  }
  function query(col,filtros,orden,lim){
    return {
      where:function(f,op,v){return query(col,filtros.concat([[f,op,v]]),orden,lim);},
      orderBy:function(f,d){return query(col,filtros,[f,d||'asc'],lim);},
      limit:function(n){return query(col,filtros,orden,n);},
      get:function(){
        var base;
        if(col==='editions'){
          base=fetchJSON('editions/index.json').then(function(ix){
            var ids=((ix&&ix.ediciones)||[]).slice().sort().reverse();
            if(lim)ids=ids.slice(0,lim);
            return Promise.all(ids.map(function(id){return fetchJSON('editions/'+id+'.json').then(function(d){return {id:id,data:d};});}));
          });
        }else base=Promise.resolve(lsAll(col));
        return base.then(function(rows){
          rows=rows.filter(function(r){return r.data&&filtros.every(function(f){var x=r.data[f[0]];switch(f[1]){case '>=':return x>=f[2];case '<=':return x<=f[2];case '==':return x===f[2];case '>':return x>f[2];case '<':return x<f[2];}return true;});});
          if(orden)rows.sort(function(a,b){var x=a.data[orden[0]],y=b.data[orden[0]];var c=x<y?-1:(x>y?1:0);return orden[1]==='desc'?-c:c;});
          if(lim)rows=rows.slice(0,lim);
          var docs=rows.map(function(r){return snap(r.id,r.data);});
          return {docs:docs,size:docs.length,empty:!docs.length};
        });
      }
    };
  }
  return {doc:doc,collection:function(col){var q=query(col,[],null,0);q.doc=function(id){return doc(col+'/'+id);};return q;}};
}
var descargas={save:function(o){
  try{var b=new Blob([o.data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);return Promise.resolve();}
  catch(e){return Promise.reject(e);}
}};
document.addEventListener('change',function(ev){
  if(!ev.target||ev.target.id!=='imp'||!ev.target.files||!ev.target.files[0])return;
  var msg=document.getElementById('exp-msg');
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result),n=0;
      (d.progreso||[]).forEach(function(p){if(p&&p.fecha){localStorage.setItem('auxo.db.progress/'+p.fecha,JSON.stringify(p));n++;}});
      (d.repaso||[]).forEach(function(r){if(r&&r.id){var x=Object.assign({},r);delete x.id;localStorage.setItem('auxo.db.review/'+r.id,JSON.stringify(x));n++;}});
      if(msg)msg.textContent='Importados '+n+' registros.';
      cargar();
    }catch(e){if(msg)msg.textContent='Ese archivo no es una copia de AUXO.';}
  };
  fr.readAsText(ev.target.files[0]);
});
renderNav();
S.db=crearDB();S.sample=null;S.downloads=descargas;
cargar();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
